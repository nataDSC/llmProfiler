version: "3.8"

services:
  # The LLM Gateway
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - redis
    networks:
      - llm-network

  # The Semantic Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - llm-network

  # The Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge
