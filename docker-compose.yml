version: "3.8"
services:
  cache:
    image: redis:8.4-alpine
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  gateway:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://cache:6379
      # Uncomment the next line to run in echo (test) mode
      # - ECHO_MODE=true
    depends_on:
      cache:
        condition: service_healthy

  ui:
    build: ./ui
    ports:
      - "8501:8501"
    environment:
      - GATEWAY_URL=http://gateway:8000/v1/chat/completions
    depends_on:
      - gateway
    restart: always

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gateway

volumes:
  redis_data:
